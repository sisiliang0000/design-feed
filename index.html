<title>设计资讯虾 🦐</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #6c63ff;
    --primary-light: #ede9ff;
    --accent: #ff6b6b;
    --text: #2d2d3a;
    --text-sub: #7c7c99;
    --border: #e8e8f0;
    --tag-bg: #f0f0fa;
    --shadow: 0 2px 12px rgba(108,99,255,0.08);
    --shadow-hover: 0 8px 28px rgba(108,99,255,0.16);
    --fav: #ffb347;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ===== HEADER ===== */
  .header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .header-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 32px; height: 60px; }
  .logo { font-size: 18px; font-weight: 700; color: var(--primary); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .logo span { font-size: 22px; }

  /* ===== TABS ===== */
  .tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 6px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; transition: all .2s; border: none; background: transparent; color: var(--text-sub); }
  .tab:hover { background: var(--primary-light); color: var(--primary); }
  .tab.active { background: var(--primary); color: #fff; }
  .tab-fav { color: var(--fav) !important; }
  .tab-fav.active { background: var(--fav) !important; color: #fff !important; }

  /* ===== SEARCH / FILTER BAR ===== */
  .toolbar { max-width: 1400px; margin: 20px auto 0; padding: 0 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
  .search-box input { width: 100%; padding: 9px 16px 9px 38px; border: 1px solid var(--border); border-radius: 24px; font-size: 14px; outline: none; background: #fff; transition: border .2s; }
  .search-box input:focus { border-color: var(--primary); }
  .search-box .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 15px; }
  .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 13px; cursor: pointer; transition: all .2s; color: var(--text-sub); }
  .filter-btn:hover, .filter-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .sort-select { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 13px; color: var(--text); outline: none; cursor: pointer; }
  .count-badge { font-size: 12px; color: var(--text-sub); margin-left: auto; white-space: nowrap; }

  /* ===== SECTION ===== */
  .section { max-width: 1400px; margin: 24px auto 0; padding: 0 24px; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .section-icon { font-size: 22px; }
  .section-title { font-size: 18px; font-weight: 700; }
  .section-count { font-size: 13px; color: var(--text-sub); background: var(--tag-bg); padding: 2px 10px; border-radius: 12px; }

  /* ===== GRID ===== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  /* ===== CARD ===== */
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; transition: all .25s; position: relative; display: flex; flex-direction: column; }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }
  .card-thumb { position: relative; width: 100%; padding-top: 56.25%; background: var(--tag-bg); overflow: hidden; }
  .card-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .card:hover .card-thumb img { transform: scale(1.04); }
  .card-thumb .platform-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; backdrop-filter: blur(4px); }
  .card-thumb .type-badge { position: absolute; top: 8px; right: 40px; background: var(--primary); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .fav-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(255,255,255,.9); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all .2s; z-index: 2; }
  .fav-btn:hover { transform: scale(1.2); background: #fff; }
  .fav-btn.faved { background: var(--fav); }
  .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--primary); }
  .card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-sub); }
  .card-author { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-sub); }
  .card-author .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--primary); font-weight: 700; flex-shrink: 0; }
  .card-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-sub); margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
  .stat-item { display: flex; align-items: center; gap: 3px; }
  .card-date { font-size: 11px; color: var(--text-sub); margin-left: auto; }
  .new-badge { position: absolute; top: 0; left: 0; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 0 0 8px 0; }

  /* ===== FAV PAGE ===== */
  .fav-empty { text-align: center; padding: 80px 24px; color: var(--text-sub); }
  .fav-empty .emoji { font-size: 48px; margin-bottom: 16px; }
  .fav-empty p { font-size: 15px; }

  /* ===== FOOTER ===== */
  .footer { text-align: center; padding: 40px 24px; color: var(--text-sub); font-size: 13px; }

  /* hidden */
  [data-hidden="true"] { display: none !important; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0d0e8; border-radius: 3px; }
</style>
</head>

  { id: "poster",   icon: "🖼️", title: "AI生海报", tab: "poster" },
  { id: "logo",     icon: "🎨", title: "AI生Logo", tab: "logo" },
  { id: "ui",       icon: "💻", title: "AI生交互/UI", tab: "ui" },
  { id: "review",   icon: "🔬", title: "AI工具测评", tab: "review" },
];

// ============================================================
// STATE
// ============================================================
let state = {
  activeTab: "all",
  searchQuery: "",
  authorFilter: "",
  sort: "date-desc",
  favorites: new Set(JSON.parse(localStorage.getItem("design_feed_favs") || "[]")),
};

function saveFavs() {
  localStorage.setItem("design_feed_favs", JSON.stringify([...state.favorites]));
}

// ============================================================
// HELPERS
// ============================================================
function fmtNum(n) {
  if (n == null) return "—";
  if (n >= 10000) return (n / 10000).toFixed(1) + "万";
  return n.toLocaleString();
}

function getAuthors() {
  const s = new Set(VIDEOS.map(v => v.author));
  return [...s].sort();
}

function filterAndSort(videos) {
  let list = [...videos];
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    list = list.filter(v => v.title.toLowerCase().includes(q) || v.author.toLowerCase().includes(q));
  }
  if (state.authorFilter) {
    list = list.filter(v => v.author === state.authorFilter);
  }
  list.sort((a, b) => {
    if (state.sort === "date-desc") return new Date(b.date) - new Date(a.date);
    if (state.sort === "date-asc")  return new Date(a.date) - new Date(b.date);
    if (state.sort === "play-desc") return (b.play || 0) - (a.play || 0);
    if (state.sort === "collect-desc") return (b.collect || 0) - (a.collect || 0);
    return 0;
  });
  return list;
}

// ============================================================
// RENDER
// ============================================================
function renderCard(v) {
  const isFav = state.favorites.has(v.id);
  const favCls = isFav ? "fav-btn faved" : "fav-btn";
  const favIcon = isFav ? "⭐" : "☆";
  const thumb = v.thumb
    ? `<img src="${v.thumb}" alt="${v.title}" loading="lazy" onerror="this.style.display='none'">`
    : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--text-sub)">🎬</div>`;
  const isNewBadge = v.isNew ? `<div class="new-badge">NEW</div>` : "";
  const platformColor = v.platform === "B站" ? "#00aeec" : "#ff2442";

  return `
  <div class="card" data-id="${v.id}">
    ${isNewBadge}
    <div class="card-thumb">
      ${thumb}
      <div class="platform-badge" style="background:${platformColor}cc">${v.platform}</div>
      <div class="type-badge">${v.type === "video" ? "🎬" : "📝"}</div>
      <button class="${favCls}" onclick="toggleFav('${v.id}',event)" title="${isFav ? "取消收藏" : "收藏"}">${favIcon}</button>
    </div>
    <div class="card-body">
      <div class="card-title"><a href="${v.url}" target="_blank">${v.title}</a></div>
      <div class="card-author">
        <div class="avatar">${v.author[0]}</div>
        <span>${v.author}</span>
        <span style="color:var(--border);margin:0 2px">·</span>
        <span style="font-size:11px">${v.fans} 粉丝</span>
      </div>
      <div class="card-stats">
        <span class="stat-item">▶️ ${fmtNum(v.play)}</span>
        <span class="stat-item">⭐ ${fmtNum(v.collect)}</span>
        <span class="stat-item">👍 ${fmtNum(v.like)}</span>
        <span class="card-date">${v.date}</span>
      </div>
    </div>
  </div>`;
}

function renderSection(sec, videos) {
  const list = filterAndSort(videos.filter(v => v.category === sec.id)).slice(0, 100);
  if (list.length === 0) return "";
  return `
  <div class="section" id="sec-${sec.id}">
    <div class="section-header">
      <span class="section-icon">${sec.icon}</span>
      <span class="section-title">${sec.title}</span>
      <span class="section-count">${list.length} 条</span>
    </div>
    <div class="grid">${list.map(renderCard).join("")}</div>
  </div>`;
}

function renderFavorites() {
  const favs = filterAndSort(VIDEOS.filter(v => state.favorites.has(v.id)));
  if (favs.length === 0) {
    return `<div class="fav-empty"><div class="emoji">⭐</div><p>还没有收藏，点击视频卡片右上角的☆收藏吧！</p></div>`;
  }
  return `
  <div class="section">
    <div class="section-header">
      <span class="section-icon">⭐</span>
      <span class="section-title">我的收藏</span>
      <span class="section-count">${favs.length} 条</span>
    </div>
    <div class="grid">${favs.map(renderCard).join("")}</div>
  </div>`;
}

function render() {
  const content = document.getElementById("mainContent");
  const tab = state.activeTab;

  if (tab === "favorites") {
    content.innerHTML = renderFavorites();
    document.getElementById("toolbar").style.display = "flex";
    document.getElementById("countBadge").textContent = `${state.favorites.size} 条收藏`;
    return;
  }

  let html = "";
  let total = 0;

  if (tab === "all") {
    for (const sec of SECTIONS) {
      const filtered = filterAndSort(VIDEOS.filter(v => v.category === sec.id));
      total += filtered.length;
      html += renderSection(sec, VIDEOS);
    }
  } else {
    const sec = SECTIONS.find(s => s.id === tab);
    if (sec) {
      html = renderSection(sec, VIDEOS);
      total = filterAndSort(VIDEOS.filter(v => v.category === sec.id)).length;
    }
  }

  content.innerHTML = html || `<div class="fav-empty"><div class="emoji">🔍</div><p>暂无内容</p></div>`;
  document.getElementById("countBadge").textContent = `共 ${total} 条`;
}

function renderAuthorFilter() {
  const authors = getAuthors();
  const container = document.getElementById("authorFilter");
  container.innerHTML = `<button class="filter-btn ${!state.authorFilter ? "active" : ""}" onclick="setAuthor('')">全部作者</button>` +
    authors.map(a => `<button class="filter-btn ${state.authorFilter === a ? "active" : ""}" onclick="setAuthor('${a}')">${a}</button>`).join("");
}

// ============================================================
// EVENT HANDLERS
// ============================================================
function toggleFav(id, e) {
  e.stopPropagation();
  if (state.favorites.has(id)) {
    state.favorites.delete(id);
  } else {
    state.favorites.add(id);
  }
  saveFavs();
  render();
}

function setAuthor(a) {
  state.authorFilter = a;
  renderAuthorFilter();
  render();
}

// Tabs
document.getElementById("mainTabs").addEventListener("click", e => {
  const tab = e.target.dataset.tab;
  if (!tab) return;
  state.activeTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  e.target.classList.add("active");
  render();
});

// Search
document.getElementById("searchInput").addEventListener("input", e => {
  state.searchQuery = e.target.value.trim();
  render();
});

// Sort
document.getElementById("sortSelect").addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});

// ============================================================
// INIT
// ============================================================
renderAuthorFilter();
render();
</script>
</body>
</html>
